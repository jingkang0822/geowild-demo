name: Verify and deploy GeoWild demo
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'docs/animal-assets.json'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish verified game
        id: deployment
        uses: actions/deploy-pages@v5
